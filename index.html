<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Básica</title>
</head>
<body>
    <h1>Página Básica</h1>
    <img src="https://cdn-icons-png.flaticon.com/128/3965/3965048.png" alt="imagen simbolos matematicos"><br>
    <label for="num1">Por favor ingrese el primer número: </label>
    <input type="number" id="num1" placeholder="Valor Numerico"><br>
    <label for="num2">Por favor ingrese el segundo número: </label>
    <input type="number" id="num2" placeholder="Valor Numerico"><br>
    <label for="operacion">Operación: </label>
    <select id="operacion">
        <option value="">Seleccione la operación</option>
        <option value="suma">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicación</option>
        <option value="division">División</option>
    </select>
    <p id="resultado"></p>
<script src="js/app.js"></script>
</body>
</html>
